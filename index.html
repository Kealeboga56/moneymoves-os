<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Money Moves OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="logo">💰 Money Moves</div>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="dashboard">📊 Dashboard</button>
                <button class="nav-item" data-view="kanban">📋 Kanban Board</button>
                <button class="nav-item" data-view="table">🗂️ Table View</button>
                <button class="nav-item" data-view="list">📝 List View</button>
                <button class="nav-item" data-view="calendar">📅 Calendar</button>
                <button class="nav-item" data-view="timeline">⏳ Timeline</button>
                <button class="nav-item" data-view="stats">📈 Statistics</button>
            </nav>
            <div class="sidebar-footer">
                <button id="export-data-btn" class="export-btn">⬇️ Export Data</button>
                <button id="theme-toggle" class="theme-btn">🌙 Toggle Theme</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content">
            <header id="top-bar">
                <div class="top-bar-left">
                    <button id="mobile-menu-btn" class="hamburger">☰</button>
                    <div class="search-bar">
                        <input type="text" id="global-search" placeholder="Search tasks...">
                    </div>
                </div>
                <div class="top-bar-actions">
                    <select id="filter-status" class="filter-select">
                        <option value="">All Statuses</option>
                        <option>Idea</option><option>Backlog</option><option>Planning</option>
                        <option>Ready</option><option>In Progress</option><option>Blocked</option>
                        <option>Review</option><option>Completed</option>
                    </select>
                    <select id="filter-priority" class="filter-select">
                        <option value="">All Priorities</option>
                        <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
                    </select>
                    <button id="new-task-btn">+ New</button>
                </div>
            </header>

            <div id="content-area">
                <!-- Views rendered dynamically here -->
            </div>
        </main>

        <!-- Task Detail Modal -->
        <div id="task-modal-overlay"></div>
        <div id="task-modal-container">
            <!-- Task details rendered dynamically here -->
        </div>

        <!-- Custom Verification Modal -->
        <div id="custom-modal-overlay">
            <div id="custom-modal">
                <h3 id="modal-title">Are you sure?</h3>
                <p id="modal-text">This action cannot be undone.</p>
                <div class="modal-actions">
                    <button id="modal-cancel" class="btn-secondary">Cancel</button>
                    <button id="modal-confirm" class="btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
